# Build the macOS binaries and publish a GitHub release when a version tag
# is pushed, for example: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $tag is not a version such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if echo "$tag" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Vet
        run: make vet

      - name: Test
        run: go test -race ./...

      - name: Build and package
        run: make package VERSION=${{ steps.version.outputs.version }}

      - name: Check the arm64 binary
        run: |
          out=$(./dist/cwatch-darwin-arm64 version)
          echo "$out"
          echo "$out" | grep -q "cwatch ${{ steps.version.outputs.version }} "

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags="$flags --prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "cwatch $GITHUB_REF_NAME" \
            dist/cwatch-darwin-arm64.tar.gz \
            dist/cwatch-darwin-amd64.tar.gz \
            dist/SHA256SUMS
